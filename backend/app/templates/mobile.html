<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#8B4513">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>NFC 书房管理</title>
<style>
:root{--p:#8B4513;--bg:#fdf8f4;--c:#fff;--t:#2c1810;--ts:#8c7b72;--b:#e8d5c8;--s:#22c55e;--r:14px;--rs:10px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--t);min-height:100vh;padding-bottom:env(safe-area-inset-bottom,20px)}
.hd{background:linear-gradient(135deg,#8B4513,#a0522d);color:#fff;padding:28px 16px 22px;text-align:center;position:sticky;top:0;z-index:100;box-shadow:0 2px 16px rgba(139,69,19,.3)}
.hd .lo{font-size:44px;display:block;margin-bottom:8px}
.hd h1{font-size:21px;font-weight:700;letter-spacing:.5px}
.hd .ip{font-size:11px;opacity:.75;margin-top:4px;font-family:monospace}
.mn{padding:14px;max-width:520px;margin:0 auto}
.cd{background:var(--c);border-radius:var(--r);padding:20px 16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(139,69,19,.06);border:1px solid var(--b)}
.cd h3{font-size:16px;color:var(--p);margin-bottom:14px;display:flex;align-items:center;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--b)}
.big{display:block;width:100%;padding:20px;border:none;border-radius:var(--r);font-size:18px;font-weight:700;text-decoration:none;text-align:center;margin-bottom:12px;cursor:pointer;transition:all .15s ease;-webkit-appearance:none}
.big:active{transform:scale(.97);opacity:.9}
.bsn{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;box-shadow:0 4px 16px rgba(59,130,246,.35)}
.bsn:active{box-shadow:0 2px 8px rgba(59,130,246,.25)}
.bt{display:block;width:100%;padding:15px;border-radius:var(--rs);border:none;font-size:15px;font-weight:600;cursor:pointer;text-align:center;margin-bottom:10px;-webkit-appearance:none;transition:all .1s ease}
.bt:active{transform:scale(.97)}
.bt-p{background:var(--p);color:#fff}
.bt-s{background:var(--s);color:#fff}
.bt-o{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
.steps{background:var(--c);border-radius:var(--r);padding:18px;margin-bottom:14px;border:1px solid #fde68a;background:#fffbeb}
.steps h4{font-size:14px;color:#92400e;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.steps ol{margin:0;padding-left:20px;font-size:14px;color:#78716c;line-height:2.2}
.steps ol li{padding:2px 0}
.info{font-size:13px;color:var(--t);line-height:2}
.info p{padding:6px 0;border-bottom:1px solid #f5f5f4}
.info p:last-child{border-bottom:none}
.code{background:#f5f5f4;padding:14px;border-radius:8px;font-family:'SF Mono',monospace;font-size:14px;color:#374151;word-break:break-all;margin-bottom:14px;user-select:all;-webkit-user-select:all}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:12px 24px;border-radius:10px;font-size:14px;z-index:9999;opacity:0;transition:opacity .3s ease;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,.25)}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="hd"><span class="lo">📚</span><h1>NFC 书房管理</h1><div class="ip">{{ ip }}:{{ backend_port }}</div></div>
<div class="mn">
<a href='{{ scan_link }}' class="big bsn">📡 点击扫描 NFC 标签</a>

<div class="steps">
<h4>📋 操作说明</h4>
<ol>
<li>点击上方「扫描 NFC 标签」按钮</li>
<li>将手机贴近 NFC 标签</li>
<li>自动跳转到对应书架或绑定页面</li>
</ol>
</div>

<div class="cd">
<h3>🏷️ 标签功能说明</h3>
<div class="info">
<p><strong>已写入数据 + 已绑定书架：</strong><br>扫描 → 自动跳转对应书架</p>
<p><strong>已绑定书架但无映射：</strong><br>扫描 → 选择逻辑书架建立映射</p>
<p><strong>未绑定（空白标签）：</strong><br>扫描 → 选择物理书架进行绑定</p>
</div>
</div>

<div class="cd">
<h3>✍️ 写入标签数据</h3>
<div style="font-size:13px;color:var(--ts);line-height:1.8;margin-bottom:12px">
使用 <strong>NFC TOOLS PRO</strong> 写入以下 JSON 数据：
</div>
<div class="code"><code>{&quot;shelf_id&quot;: 1}</code></div>
<button class="bt bt-s" onclick="copyExample()">📋 复制示例数据</button>
<button class="bt bt-o" onclick="goToShelfList()">📚 查看书架列表（获取 ID）</button>
</div>
</div>

<div id="toast" class="toast"></div>

<script>
var A = window.location.origin;

function showToast(msg){
    var t=document.getElementById('toast');
    t.textContent=msg;t.classList.add('show');
    clearTimeout(t._tid);t._tid=setTimeout(function(){t.classList.remove('show')},2500);
}

function copyText(text){
    if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(text);
    return new Promise(function(resolve,reject){
        try{
            var t=document.createElement('textarea');t.value=text;
            t.style.position='fixed';t.style.left='-9999px';t.style.top='-9999px';t.style.opacity='0';
            document.body.appendChild(t);t.contentEditable='true';t.readOnly=false;
            var r=document.createRange();r.selectNodeContents(t);var s=window.getSelection();
            s.removeAllRanges();s.addRange(r);t.setSelectionRange(0,999999);
            var ok=document.execCommand('copy');document.body.removeChild(t);s.removeAllRanges();
            if(ok)resolve();else reject(new Error());
        }catch(e){reject(e)}
    })
}

function copyExample(){
    copyText('{"shelf_id": 1}').then(function(){
        showToast('✅ 已复制！请打开 NFC TOOLS PRO → 写 → 写数据 → 粘贴');
    }).catch(function(){
        showToast('⚠️ 复制失败，请手动选中上方文本复制');
    });
}

function goToShelfList(){
    var frontendUrl = A.replace(':8000', ':5173');
    if (frontendUrl === A) { frontendUrl = A + ':5173'; }
    window.location.href = frontendUrl + '/shelf/1';
}
</script>
</body></html>
