[build-system]
requires = ["setuptools>=75.0", "wheel>=0.44"]
build-backend = "setuptools.build_meta"

[project]
name = "nfc-bookshelf-backend"
version = "2.0.0"
description = "个人图书管理系统 - 后端服务（FastAPI + SQLAlchemy + SQLite）"
readme = {file = "README.md", content-type = "text/markdown"}
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "jswantao"},
]
keywords = ["book-management", "nfc", "fastapi", "sqlalchemy", "douban"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
]

# ==================== 运行时依赖 ====================
dependencies = [
    # Web 框架
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # 数据库
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "aiosqlite>=0.20.0",
    # 数据验证
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    # 网络请求
    "httpx>=0.28.0",
    # HTML 解析
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    # 文件处理
    "python-multipart>=0.0.12",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.1",
    "csvkit>=2.0.1",
    # 图片处理
    "Pillow>=11.0.0",
    # 异步支持
    "aiofiles>=24.1.0",
    # 安全
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "cryptography>=43.0",
    # 日志
    "loguru>=0.7.3",
    # 工具
    "python-dateutil>=2.9.0",
    "tenacity>=9.0.0",
    "cachetools>=6.0.0",
    # 模板引擎
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",          # 测试用 HTTP 客户端
]

[project.urls]
Homepage = "https://github.com/jswantao/NFCbooksmanager"
Documentation = "https://github.com/jswantao/NFCbooksmanager/blob/main/README.md"
Repository = "https://github.com/jswantao/NFCbooksmanager"
Issues = "https://github.com/jswantao/NFCbooksmanager/issues"

# ==================== 工具配置 ====================

[tool.setuptools.packages.find]
include = ["app*"]

# ---- Ruff (Linter + Formatter) ----
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes (unused imports, etc.)
    "I",      # isort (import ordering)
    "N",      # pep8-naming
    "UP",     # pyupgrade (modern syntax)
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line-too-long (handled by formatter)
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["app"]
force-sort-within-sections = true

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["classmethod", "pydantic.field_validator"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ---- Mypy (Type Checker) ----
[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_no_return = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "loguru",
    "pydantic_settings",
    "cryptography.*",
    "bs4.*",
    "lxml.*",
    "openpyxl.*",
    "xlrd.*",
    "csvkit.*",
    "tenacity.*",
    "cachetools.*",
    "jose.*",
    "passlib.*",
    "aiofiles.*",
    "python_multipart.*",
]
ignore_missing_imports = true

# ---- Pytest ----
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "app/__pycache__/*",
    "test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
